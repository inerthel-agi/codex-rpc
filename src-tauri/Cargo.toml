[package]
name = "codex_rich_presence_tray"
version = "0.6.0"
description = "Codex RPC"
authors = ["Inerthel"]
license = "MIT"
edition = "2021"

[profile.release]
codegen-units = 1
lto = "thin"
strip = true

[[bin]]
name = "codex-rich-presence"
path = "src/main.rs"

[build-dependencies]
slint-build = "1.19"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[dependencies]
notify-rust = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Software renderer only: no GPU context and no web view, which keeps memory at a few MB.
slint = { version = "1.19", default-features = false, features = [
  "std",
  "compat-1-2",
  "backend-winit",
  "renderer-software",
  "system-tray",
  # Window options and focus events for the Windows tray panel (panel.rs).
  "unstable-winit-030",
] }

[target.'cfg(windows)'.dependencies]
# Already used by Slint; decodes the tray picture for the Windows icon.
png = "0.18"
windows = { version = "0.61.3", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_LibraryLoader",
  "Win32_System_Pipes",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_UI_Controls",
  "Win32_UI_HiDpi",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
# Slint's headless platform, so tests can build the settings window.
i-slint-backend-testing = "=1.19.0"
